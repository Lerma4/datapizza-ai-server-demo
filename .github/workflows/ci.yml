name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [ "3.12" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --no-dev --frozen -o requirements.txt
          uv pip install --system -r requirements.txt
          python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        env:
          OPENAI_MODEL: gpt-4o-mini
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: reports/junit.xml
      - name: Summary
        if: always()
        run: |
          echo "## Test & Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "OS: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/datapizza-ai-demo:latest
          platforms: linux/amd64
          provenance: false
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Image pushed to: ghcr.io/${{ github.repository_owner }}/datapizza-ai-demo:latest" >> $GITHUB_STEP_SUMMARY
          else
            echo "Docker image built successfully (no push on PR)" >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Slack notify
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: github-actions
          SLACK_ICON_EMOJI: ':robot_face:'
          SLACK_COLOR: ${{ needs.build.result == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "CI for ${{ github.repository }} (#${{ github.run_number }})"
          SLACK_MESSAGE: |
            test: ${{ needs.test.result }}
            build: ${{ needs.build.result }}